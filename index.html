<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>CHOPPA 3D</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;touch-action:none}
    html,body{height:100%;background:#000;display:grid;place-items:center;font-family:system-ui}
    #wrap{position:relative;width:390px;height:844px;border-radius:24px;overflow:hidden;background:#031226;box-shadow:0 0 50px rgba(0,160,255,.3)}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    #hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;font-weight:700}
    .box{background:rgba(0,0,0,.45);padding:8px 12px;border-radius:10px;border:1px solid rgba(0,200,255,.4)}
    #start,#over{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#031226,#000)}
    #over{display:none;background:rgba(0,0,0,.85)}
    button{padding:12px 20px;border:0;border-radius:999px;background:#00aaff;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="390" height="844"></canvas>
    <div id="hud">
      <div class="box">BEST <span id="best">0</span></div>
      <div class="box">SCORE <span id="score">0</span></div>
    </div>
    <div id="start"><button id="play">TAP TO FLY</button></div>
    <div id="over"><div style="text-align:center;color:#fff"><h1>CRASHED</h1><p id="final"></p><br/><button id="retry">RETRY</button></div></div>
  </div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=c.width,H=c.height,GRD=70;
let y=H/2,vy=0,rot=0,hold=false,score=0,best=+(localStorage.bestChop||0),speed=2.7,gap=210,pipes=[],t=0,phase='start';
const scoreEl=document.getElementById('score');
document.getElementById('best').textContent=best;
function reset(){y=H/2;vy=0;rot=0;score=0;speed=2.7;gap=210;pipes=[];t=0;scoreEl.textContent='0';}
function spawn(){const top=80+Math.random()*(H-GRD-gap-160);pipes.push({x:W+70,top,pass:false});}
function heli(){x.save();x.translate(90,y);x.rotate(rot);x.fillStyle='#1a4f88';x.beginPath();x.ellipse(0,0,28,13,0,0,6.28);x.fill();x.fillStyle='#9de3ff';x.beginPath();x.ellipse(10,-3,11,7,0,0,6.28);x.fill();x.strokeStyle='#d2f4ff';x.lineWidth=2;x.beginPath();x.moveTo(-10,-18);x.lineTo(45,-18);x.stroke();x.restore();}
function draw(){x.clearRect(0,0,W,H);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#061b37');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,W,H);
for(const p of pipes){x.fillStyle='#00a06b';x.fillRect(p.x,0,62,p.top);x.fillRect(p.x,p.top+gap,62,H-(p.top+gap)-GRD);}x.fillStyle='#091a2f';x.fillRect(0,H-GRD,W,GRD);heli();}
function update(){if(phase!=='play') return;if(hold) vy-=0.55; else vy+=0.38;vy=Math.max(-7,Math.min(8,vy));y+=vy;rot+=((vy*0.03)-rot)*.15;
t++;if(t%95===0) spawn();for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];p.x-=speed;if(!p.pass&&p.x+62<90){p.pass=true;score++;scoreEl.textContent=score;if(score%5===0){speed+=.35;gap=Math.max(150,gap-8);}}if(p.x<-80)pipes.splice(i,1);const hitX=90+20>p.x&&90-20<p.x+62,hitY=y-10<p.top||y+10>p.top+gap;if(hitX&&hitY) end();}
if(y>H-GRD-12||y<12) end();}
function end(){phase='dead';if(score>best){best=score;localStorage.bestChop=best;}document.getElementById('final').textContent=`Score: ${score} | Best: ${best}`;document.getElementById('best').textContent=best;document.getElementById('over').style.display='grid';}
function loop(){update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function press(e){e?.preventDefault();if(phase==='play')hold=true}function lift(e){e?.preventDefault();hold=false}
c.addEventListener('pointerdown',press);c.addEventListener('pointerup',lift);c.addEventListener('pointerleave',lift);
document.getElementById('play').onclick=()=>{reset();phase='play';document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';}
document.getElementById('retry').onclick=()=>{reset();phase='play';document.getElementById('over').style.display='none';}
</script>
</body>
</html>
